# Netlify builds the frontend from this repo.
# Set VITE_API_URL in Netlify → Site configuration → Environment variables.
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
